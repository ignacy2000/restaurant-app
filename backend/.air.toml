root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  full_bin = "./tmp/api"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_dir = ["cmd", "internal", "pkg"]
  exclude_dir = ["tmp", "vendor", ".git", ".idea", ".vscode"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "1s"
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
